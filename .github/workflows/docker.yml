name: Build & Push Docker Image

on:
  push:
    branches:
      - main
      - develop
      - feature/prisma-migration
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── CHECK: valida que la imagen compila correctamente ─────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        # Prisma 7.2+: prisma generate funciona sin DATABASE_URL definida
        run: npx prisma generate

      - name: TypeScript build check
        run: npm run build

      - name: Docker build check (sin push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false

  # ── BUILD & PUSH: solo si los checks pasan y es push ──────────────────────
  build-and-push:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── DEPLOY ────────────────────────────────────────────────────────────────
  # TODO: descomentar cuando tengas DEPLOY_HOST, DEPLOY_USER y SSH_PRIVATE_KEY
  #       configurados en GitHub → Settings → Secrets and variables → Actions